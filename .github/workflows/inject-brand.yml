name: Refresh Galifar header

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/inject-brand.yml'

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Refresh company header and bust cache
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('index.html')
          s = p.read_text(encoding='utf-8')
          s = s.replace('src="assets/galifar-logo-pj.svg?v=2"', 'src="assets/galifar-logo-pj.svg?v=3"')
          for v in range(2, 12):
              s = s.replace(f'brand.css?v={v}', 'brand.css?v=12')
          p.write_text(s, encoding='utf-8')
          PY
      - name: Commit refreshed header
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          if git diff --cached --quiet; then
            echo "No changes needed"
          else
            git commit -m "Ajuste le header Galifar sur mobile"
            git push
          fi
