name: Refresh Galifar assets

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/inject-brand.yml'

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Force CSS refresh
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text(encoding='utf-8')
          s=s.replace('brand.css?v=14','brand.css?v=15')
          p.write_text(s,encoding='utf-8')
          PY
      - name: Commit cache bump
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          if git diff --cached --quiet; then
            echo "No changes needed"
          else
            git commit -m "Force le CSS final Renault Master"
            git push
          fi
