name: Refresh Galifar header

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/inject-brand.yml'

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Remove legacy logo hook and bust cache
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('index.html')
          s = p.read_text(encoding='utf-8')
          s = s.replace('class="logo"', 'class="logo-text"')
          s = s.replace('brand.css?v=2', 'brand.css?v=8')
          s = s.replace('brand.css?v=3', 'brand.css?v=8')
          s = s.replace('brand.css?v=4', 'brand.css?v=8')
          s = s.replace('brand.css?v=5', 'brand.css?v=8')
          s = s.replace('brand.css?v=6', 'brand.css?v=8')
          s = s.replace('brand.css?v=7', 'brand.css?v=8')
          p.write_text(s, encoding='utf-8')
          PY
      - name: Commit header refresh
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          if git diff --cached --quiet; then
            echo "No changes needed"
          else
            git commit -m "Supprime définitivement le symbole du header"
            git push
          fi
