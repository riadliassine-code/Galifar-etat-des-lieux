name: Refresh Galifar assets

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/inject-brand.yml'

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply departure return cycle UI
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          p=Path('index.html')
          s=p.read_text(encoding='utf-8')
          new_func=r'''async function loadVehicles(){ show("vehicleScreen"); $("vehicleGrid").innerHTML=""; $("vehicleLoading").className="notice info"; $("vehicleLoading").textContent="Chargement des véhicules…"; $("vehicleLoading").classList.remove("hidden"); $("vehicleHeading").textContent=state.vehicleType==="FOURGON"?"Choisis le fourgon":"Choisis le vélo cargo"; try{ const data=await apiGet({action:"vehicles",type:state.vehicleType}); const vehicles=data.vehicles||[]; if(!vehicles.length){$("vehicleLoading").textContent="Aucun véhicule disponible.";return;} $("vehicleLoading").classList.add("hidden"); $("vehicleGrid").innerHTML=vehicles.map(v=>{ const touring=!!v.in_tour, done=!!v.cycle_complete, returnReady=!!v.ready_for_return; let stateInfo=""; if(touring){ stateInfo=`<span class="status-pill touring-pill">Véhicule en tournée</span><div class="vehicle-tour-info">Départ : ${esc(v.tour_driver||"Livreur")}${v.tour_started_at?` • ${fmtDate(v.tour_started_at)}`:""}</div>`; } else if(done){ stateInfo=`<span class="status-pill cycle-done-pill">Retour effectué</span><div class="vehicle-tour-info">Retour : ${esc(v.last_driver||"Livreur")}${v.last_inspection_at?` • ${fmtDate(v.last_inspection_at)}`:""}</div>`; } else if(returnReady){ stateInfo=`<span class="status-pill return-pill">Retour à effectuer</span><div class="vehicle-tour-info">Départ : ${esc(v.last_driver||"Livreur")}${v.last_inspection_at?` • ${fmtDate(v.last_inspection_at)}`:""}</div>`; } else { stateInfo=`<span class="status-pill departure-pill">Départ à effectuer</span>`; } const blocked=touring||done; return `<button class="vehicle${touring?" touring":""}${done?" cycle-complete":""}" data-id="${esc(v.id)}" type="button" ${blocked?"disabled aria-disabled=\"true\"":""}><div class="vehicle-photo">${v.photo_url?`<img src="${esc(v.photo_url)}" alt="${esc(v.label||v.code)}">`:(v.type==="FOURGON"?"🚐":"🚲")}</div><div class="vehicle-name">${esc(v.label||v.code)}</div><div class="vehicle-meta">${v.registration?esc(v.registration):"Plaque à renseigner"}</div>${stateInfo}</button>`; }).join(""); [...$("vehicleGrid").querySelectorAll(".vehicle:not(.touring):not(.cycle-complete)")].forEach(el=>el.addEventListener("click",()=>{ state.vehicle=vehicles.find(v=>v.id===el.dataset.id); setupPhotos(); show("photosScreen"); })); }catch(e){ $("vehicleLoading").className="notice error"; $("vehicleLoading").textContent="Impossible de charger les véhicules : "+e.message; } }'''
          s, n = re.subn(r'async function loadVehicles\(\)\{.*?\n\nconst photoDefs=', new_func+'\n\nconst photoDefs=', s, count=1, flags=re.S)
          if n != 1:
              raise SystemExit('loadVehicles replacement failed')

          s=s.replace('$("selectedVehicleBanner").textContent=`${state.vehicle?.label||state.vehicle?.code} — ${state.vehicle?.registration||"plaque à renseigner"}`;', '$("selectedVehicleBanner").textContent=`État des lieux ${state.vehicle?.next_inspection_type==="RETOUR"?"de retour":"de départ"} — ${state.vehicle?.label||state.vehicle?.code} — ${state.vehicle?.registration||"plaque à renseigner"}`;')
          s=s.replace('$("successText").textContent=`${state.driverName} — ${state.vehicle.label||state.vehicle.code} — ${statusLabel(state.overallStatus)}`;', '$("successText").textContent=`${created.inspectionType==="RETOUR"?"Retour":"Départ"} — ${state.driverName} — ${state.vehicle.label||state.vehicle.code} — ${statusLabel(state.overallStatus)}`;')
          s=s.replace('<div class="history-date">${fmtDate(r.completed_at)}${issues.length?` • ${esc(issues[0].category)}`:""}</div>', '<div class="history-date">${r.inspection_type==="RETOUR"?"Retour":"Départ"} • ${fmtDate(r.completed_at)}${issues.length?` • ${esc(issues[0].category)}`:""}</div>')
          s=s.replace('<div class="detail-line"><b>Date :</b> ${fmtDate(i.completed_at)}</div><div class="detail-line"><b>État :</b>', '<div class="detail-line"><b>Type :</b> ${i.inspection_type==="RETOUR"?"Retour":"Départ"}</div><div class="detail-line"><b>Date :</b> ${fmtDate(i.completed_at)}</div><div class="detail-line"><b>État :</b>')
          s=s.replace('brand.css?v=16','brand.css?v=17')
          p.write_text(s,encoding='utf-8')

          css=Path('brand.css')
          c=css.read_text(encoding='utf-8')
          marker='/* Cycle départ / retour */'
          if marker not in c:
              c += '''\n\n/* Cycle départ / retour */\n.departure-pill{background:#1E3325!important;color:#8EE8A8!important;display:inline-flex!important}\n.return-pill{background:#332E1D!important;color:#F0D47E!important;display:inline-flex!important}\n.cycle-done-pill{background:#263129!important;color:#AEB8B0!important;display:inline-flex!important}\n.vehicle.cycle-complete{opacity:.58!important;cursor:not-allowed!important}\n.vehicle.cycle-complete:hover{border-color:#3A403B!important}\n'''
          css.write_text(c,encoding='utf-8')
          PY
      - name: Commit departure return UI
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html brand.css
          if git diff --cached --quiet; then
            echo "No changes needed"
          else
            git commit -m "Ajoute le cycle depart retour"
            git push
          fi
