name: Publish Renault Master image

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/inject-brand.yml'

permissions:
  contents: write

jobs:
  publish-image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build JPEG
        run: |
          python - <<'PY'
          from pathlib import Path
          import base64
          src = Path('assets/renault-master-card-v2.b64').read_text().strip()
          data = base64.b64decode(src)
          if len(data) < 6000 or not data.startswith(b'\xff\xd8') or not data.endswith(b'\xff\xd9'):
              raise SystemExit(f'JPEG invalide: {len(data)} octets')
          Path('assets/renault-master-galifar-final.jpg').write_bytes(data)
          print(f'JPEG valide: {len(data)} octets')
          PY
      - name: Commit JPEG
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/renault-master-galifar-final.jpg
          if git diff --cached --quiet; then
            echo "No changes needed"
          else
            git commit -m "Publie la photo Renault Master valide"
            git push
          fi
