name: Refresh Galifar header

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/inject-brand.yml'

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build verified Renault Master image
        run: |
          python - <<'PY'
          from pathlib import Path
          import base64
          src = Path('assets/renault-master-card-v1.jpg.b64').read_text(encoding='utf-8').strip()
          data = base64.b64decode(src, validate=True)
          out = Path('assets/renault-master-card-v1.jpg')
          out.write_bytes(data)
          assert data[:3] == b'\xff\xd8\xff', 'JPEG invalide'
          print('JPEG valide:', len(data), 'octets')
          PY
      - name: Apply monthly odometer rule
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('index.html')
          s = p.read_text(encoding='utf-8')
          old_defs = 'const photoDefs={FOURGON:["Face avant","Face arrière","Côté gauche","Côté droit","Cabine","Zone de chargement","Compteur"],VELO_CARGO:["Vue générale","Roues / pneus","Freins / transmission","Caisse cargo"]};'
          new_defs = old_defs + '\nfunction isMonthEnd(){ const d=new Date(); const tomorrow=new Date(d.getFullYear(),d.getMonth(),d.getDate()+1); return tomorrow.getMonth()!==d.getMonth(); }\nfunction odometerIsValid(){ const v=$("odometer").value.trim(); return v!=="" && Number.isFinite(Number(v)) && Number(v)>=0; }'
          if old_defs in s and 'function isMonthEnd()' not in s:
              s = s.replace(old_defs, new_defs)
          p.write_text(s, encoding='utf-8')
          PY
      - name: Commit fixes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html assets/renault-master-card-v1.jpg
          if git diff --cached --quiet; then
            echo "No changes needed"
          else
            git commit -m "Publie la photo Renault Master JPEG valide"
            git push
          fi
