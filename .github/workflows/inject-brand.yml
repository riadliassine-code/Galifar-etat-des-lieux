name: Refresh Galifar assets

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/inject-brand.yml'

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Switch driver identification to first name
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text(encoding='utf-8')
          s=s.replace('Renseigne ton nom et prénom pour commencer l\'état des lieux.','Renseigne ton prénom pour commencer l\'état des lieux.')
          s=s.replace('Nom et prénom du livreur','Prénom du livreur')
          s=s.replace('placeholder="Ex. Karim Dupont"','placeholder="Ex. Karim"')
          s=s.replace('autocomplete="name"','autocomplete="given-name"')
          p.write_text(s,encoding='utf-8')
          PY
      - name: Commit first-name identification
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          if git diff --cached --quiet; then
            echo "No changes needed"
          else
            git commit -m "Identifie les livreurs par prénom"
            git push
          fi
